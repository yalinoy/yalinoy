<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Aretu product loop</title><desc id="desc">From long-term goals to weekly planning, daily execution, review and personal history.</desc>
<rect width="1400" height="620" rx="32" fill="#F7F3EA"/>
<text x="70" y="88" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#1B1B1B">Aretu — the execution loop</text>
<text x="70" y="130" font-family="Inter,Arial,sans-serif" font-size="20" fill="#625E55">Turn intent into a system that can be executed, measured and improved.</text>
<g font-family="Inter,Arial,sans-serif">
<g transform="translate(70 210)"><rect width="230" height="170" rx="24" fill="#FFFFFF" stroke="#D8D0BF" stroke-width="2"/><text x="28" y="48" font-size="16" font-weight="700" fill="#2F5597">01 · DIRECTION</text><text x="28" y="88" font-size="26" font-weight="700" fill="#1B1B1B">Goals</text><text x="28" y="122" font-size="17" fill="#625E55">Life areas · pathways</text><text x="28" y="148" font-size="17" fill="#625E55">Milestones</text></g>
<g transform="translate(335 210)"><rect width="230" height="170" rx="24" fill="#FFFFFF" stroke="#D8D0BF" stroke-width="2"/><text x="28" y="48" font-size="16" font-weight="700" fill="#2F5597">02 · COMMIT</text><text x="28" y="88" font-size="26" font-weight="700" fill="#1B1B1B">Weekly plan</text><text x="28" y="122" font-size="17" fill="#625E55">Priorities · tasks</text><text x="28" y="148" font-size="17" fill="#625E55">Habit plan</text></g>
<g transform="translate(600 210)"><rect width="230" height="170" rx="24" fill="#2F5597"/><text x="28" y="48" font-size="16" font-weight="700" fill="#DCE6FA">03 · EXECUTE</text><text x="28" y="88" font-size="26" font-weight="700" fill="#FFFFFF">Today</text><text x="28" y="122" font-size="17" fill="#EEF3FF">Tasks · habits</text><text x="28" y="148" font-size="17" fill="#EEF3FF">Nutrition · reading</text></g>
<g transform="translate(865 210)"><rect width="230" height="170" rx="24" fill="#FFFFFF" stroke="#D8D0BF" stroke-width="2"/><text x="28" y="48" font-size="16" font-weight="700" fill="#2F5597">04 · MEASURE</text><text x="28" y="88" font-size="26" font-weight="700" fill="#1B1B1B">Review</text><text x="28" y="122" font-size="17" fill="#625E55">Plan vs actual</text><text x="28" y="148" font-size="17" fill="#625E55">Progress signals</text></g>
<g transform="translate(1130 210)"><rect width="200" height="170" rx="24" fill="#FFFFFF" stroke="#D8D0BF" stroke-width="2"/><text x="24" y="48" font-size="16" font-weight="700" fill="#2F5597">05 · REMEMBER</text><text x="24" y="88" font-size="26" font-weight="700" fill="#1B1B1B">History</text><text x="24" y="122" font-size="17" fill="#625E55">Day · year</text><text x="24" y="148" font-size="17" fill="#625E55">Personal record</text></g>
<g fill="#2F5597" font-size="34" font-weight="700"><text x="307" y="306">→</text><text x="572" y="306">→</text><text x="837" y="306">→</text><text x="1102" y="306">→</text></g>
<path d="M1230 410 C1230 520 190 520 190 410" fill="none" stroke="#A59A83" stroke-width="3" stroke-dasharray="9 9"/><polygon points="176,412 203,399 199,428" fill="#A59A83"/>
<text x="500" y="548" font-size="18" fill="#625E55">Each review feeds the next planning cycle — the system gets better through use.</text>
