<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Atlas safety-first research workflow</title><desc id="desc">Research inputs pass through guardrails into analysis artifacts and human review, with no live execution path.</desc><rect width="1400" height="720" rx="32" fill="#111318"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="86" font-size="38" font-weight="700" fill="#F7F3EA">Automation with a hard ceiling</text><text x="70" y="128" font-size="20" fill="#AEB5C2">Atlas can structure research, generate artifacts and preserve auditability — but it cannot silently escalate into execution.</text><rect x="90" y="205" width="1220" height="410" rx="28" fill="#171A20" stroke="#303641" stroke-width="2"/><rect x="140" y="275" width="220" height="100" rx="20" fill="#253F70"/><text x="170" y="318" font-size="17" font-weight="700" fill="#BFD2F7">INPUTS</text><text x="170" y="348" font-size="24" font-weight="700" fill="#FFFFFF">Human research data</text><rect x="430" y="275" width="220" height="100" rx="20" fill="#6A4A2A"/><text x="460" y="318" font-size="17" font-weight="700" fill="#F6D6B1">GUARDRAILS</text><text x="460" y="348" font-size="24" font-weight="700" fill="#FFFFFF">Mode + safety gates</text><rect x="720" y="275" width="220" height="100" rx="20" fill="#22262D" stroke="#424A57"/><text x="750" y="318" font-size="17" font-weight="700" fill="#B9C0CC">ARTIFACTS</text><text x="750" y="348" font-size="24" font-weight="700" fill="#FFFFFF">Memo · research pack</text><rect x="1010" y="275" width="220" height="100" rx="20" fill="#3A694B"/><text x="1040" y="318" font-size="17" font-weight="700" fill="#D9F4E0">AUTHORITY</text><text x="1040" y="348" font-size="24" font-weight="700" fill="#FFFFFF">Human review</text><g fill="#7E8CA3" font-size="32" font-weight="700"><text x="385" y="337">→</text><text x="675" y="337">→</text><text x="965" y="337">→</text></g><rect x="430" y="455" width="510" height="95" rx="20" fill="#482A2D" stroke="#7A3D43" stroke-width="2"/><text x="465" y="495" font-size="17" font-weight="700" fill="#F5C2C7">FORBIDDEN STATE</text><text x="465" y="526" font-size="24" font-weight="700" fill="#FFFFFF">Live execution requested → hard refusal</text><path d="M540 375 L540 440" stroke="#A95A62" stroke-width="3"/><polygon points="530,430 550,430 540,450" fill="#A95A62"/><text x="1008" y="490" font-size="18" fill="#AEB5C2">Candidate ≠ recommendation</text><text x="1008" y="520" font-size="18" fill="#AEB5C2">Review ≠ trade approval</text><text x="140" y="592" font-size="18" fill="#AEB5C2">Current system invariant:</text><text x="330" y="592" font-size="18" font-weight="700" fill="#F7F3EA">there is no live-order execution path.</text></g></svg>