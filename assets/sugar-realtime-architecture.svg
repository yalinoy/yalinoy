<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Sugar Game real-time architecture</title><desc id="desc">Multiple browser clients coordinate through a Socket.IO server with in-memory game state and persistent PostgreSQL-backed identity and social data.</desc><rect width="1400" height="720" rx="32" fill="#111318"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="86" font-size="38" font-weight="700" fill="#F7F3EA">Real-time game state, persistent identity</text><text x="70" y="128" font-size="20" fill="#AEB5C2">Fast multiplayer coordination stays in memory. Accounts, points and social state persist separately.</text><rect x="90" y="205" width="1220" height="420" rx="28" fill="#171A20" stroke="#303641" stroke-width="2"/><g><rect x="135" y="265" width="190" height="76" rx="18" fill="#253F70"/><text x="165" y="312" font-size="22" font-weight="700" fill="#FFFFFF">Browser · Player 1</text><rect x="135" y="365" width="190" height="76" rx="18" fill="#253F70"/><text x="165" y="412" font-size="22" font-weight="700" fill="#FFFFFF">Browser · Player 2</text><rect x="135" y="465" width="190" height="76" rx="18" fill="#253F70"/><text x="165" y="512" font-size="22" font-weight="700" fill="#FFFFFF">Browser · Players 3–4</text></g><rect x="445" y="305" width="300" height="195" rx="22" fill="#6A4A2A"/><text x="480" y="350" font-size="17" font-weight="700" fill="#F6D6B1">REAL-TIME COORDINATOR</text><text x="480" y="386" font-size="27" font-weight="700" fill="#FFFFFF">Node.js + Socket.IO</text><text x="480" y="425" font-size="19" fill="#F5E1C8">rooms · turns · reconnects</text><text x="480" y="457" font-size="19" fill="#F5E1C8">auth · join flow · events</text><g stroke="#7E8CA3" stroke-width="3" fill="none"><path d="M325 303 L430 360"/><path d="M325 403 L430 403"/><path d="M325 503 L430 446"/></g><g fill="#7E8CA3"><polygon points="420,350 445,367 418,369"/><polygon points="420,393 445,403 420,413"/><polygon points="418,437 445,439 420,456"/></g><rect x="855" y="265" width="300" height="115" rx="20" fill="#3A694B"/><text x="890" y="307" font-size="17" font-weight="700" fill="#D9F4E0">LIVE STATE</text><text x="890" y="342" font-size="25" font-weight="700" fill="#FFFFFF">In-memory game engine</text><rect x="855" y="425" width="300" height="115" rx="20" fill="#22262D" stroke="#424A57"/><text x="890" y="467" font-size="17" font-weight="700" fill="#B9C0CC">PERSISTENT STATE</text><text x="890" y="502" font-size="25" font-weight="700" fill="#FFFFFF">PostgreSQL</text><path d="M745 360 L840 323" stroke="#7E8CA3" stroke-width="3"/><polygon points="828,317 855,318 837,337" fill="#7E8CA3"/><path d="M745 445 L840 480" stroke="#7E8CA3" stroke-width="3"/><polygon points="837,466 855,487 828,484" fill="#7E8CA3"/><text x="855" y="575" font-size="18" fill="#AEB5C2">Development fallback: local file store</text><text x="135" y="592" font-size="18" fill="#AEB5C2">Design goal:</text><text x="247" y="592" font-size="18" font-weight="700" fill="#F7F3EA">a refresh or network hiccup should not destroy player identity.</text></g></svg>